components:
  schemas:
    ATM:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        district_name:
          type: string
          readOnly: true
        assigned_technician_name:
          type: string
          readOnly: true
        operational_state:
          type: string
          readOnly: true
        active_incident:
          type: string
          readOnly: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/ATMComponent'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reference:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 120
        atm_type:
          type: string
          maxLength: 80
        manufacturer:
          type: string
          maxLength: 120
        model:
          type: string
          maxLength: 120
        serial_number:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        ip_address:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: Whether the ATM is part of active district operations.
        status:
          allOf:
          - $ref: '#/components/schemas/ATMStatusEnum'
          description: |-
            Technical / operational condition of the ATM.

            * `OPERATIONAL` - Operational
            * `WARNING` - Warning
            * `DEGRADED` - Degraded
            * `FAULT` - Fault
            * `OFFLINE` - Offline
            * `CRITICAL` - Critical
            * `MAINTENANCE` - Maintenance
            * `UNDER_REPAIR` - Under Repair
            * `UNKNOWN` - Unknown
        health:
          $ref: '#/components/schemas/HealthEnum'
        network_status:
          $ref: '#/components/schemas/CommunicationStatusEnum'
        power_status:
          $ref: '#/components/schemas/CommunicationStatusEnum'
        hardware_status:
          $ref: '#/components/schemas/CommunicationStatusEnum'
        communication_status:
          $ref: '#/components/schemas/CommunicationStatusEnum'
        installation_date:
          type: string
          format: date
          nullable: true
        last_checked:
          type: string
          format: date-time
          nullable: true
        last_status_change:
          type: string
          format: date-time
          nullable: true
        last_maintenance:
          type: string
          format: date-time
          nullable: true
        next_maintenance:
          type: string
          format: date-time
          nullable: true
        assigned_team:
          type: string
          maxLength: 150
        notes:
          type: string
        photo:
          type: string
          format: uri
          nullable: true
          description: Photo of the ATM unit (front view or signage).
        branch:
          type: integer
        assigned_technician:
          type: integer
          nullable: true
      required:
      - active_incident
      - assigned_technician_name
      - branch
      - branch_name
      - components
      - created_at
      - district_name
      - id
      - operational_state
      - reference
      - updated_at
    ATMComponent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        component_type:
          $ref: '#/components/schemas/ComponentTypeEnum'
        status:
          $ref: '#/components/schemas/CommunicationStatusEnum'
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        notes:
          type: string
        atm:
          type: integer
      required:
      - atm
      - component_type
      - created_at
      - id
      - updated_at
    ATMStatusEnum:
      enum:
      - OPERATIONAL
      - WARNING
      - DEGRADED
      - FAULT
      - OFFLINE
      - CRITICAL
      - MAINTENANCE
      - UNDER_REPAIR
      - UNKNOWN
      type: string
      description: |-
        * `OPERATIONAL` - Operational
        * `WARNING` - Warning
        * `DEGRADED` - Degraded
        * `FAULT` - Fault
        * `OFFLINE` - Offline
        * `CRITICAL` - Critical
        * `MAINTENANCE` - Maintenance
        * `UNDER_REPAIR` - Under Repair
        * `UNKNOWN` - Unknown
    ActionTypeEnum:
      enum:
      - CHECK_STATUS
      - CHECK_ATM_STATUS
      - PHYSICAL_INSPECTION
      - CHECK_POWER
      - CHECK_CONNECTION
      - CHECK_NETWORK
      - CHECK_COMMUNICATION
      - CHECK_HARDWARE
      - CHECK_DISPLAY
      - CHECK_CARD_READER
      - CHECK_CASH_DISPENSER
      - CHECK_RECEIPT_PRINTER
      - CHECK_SOFTWARE_ERROR
      - RECORD_OBSERVATION
      - RECORD_ERROR
      - AUTHORIZED_TROUBLESHOOTING
      - PERFORM_AUTHORIZED_ACTION
      - RETEST_ATM
      - VERIFY_SERVICE
      - ESCALATE
      - ESCALATE_INCIDENT
      type: string
      description: |-
        * `CHECK_STATUS` - Check Status
        * `CHECK_ATM_STATUS` - Check ATM Status
        * `PHYSICAL_INSPECTION` - Physical Inspection
        * `CHECK_POWER` - Check Power
        * `CHECK_CONNECTION` - Check Connection
        * `CHECK_NETWORK` - Check Network
        * `CHECK_COMMUNICATION` - Check Communication
        * `CHECK_HARDWARE` - Check Hardware
        * `CHECK_DISPLAY` - Check Display
        * `CHECK_CARD_READER` - Check Card Reader
        * `CHECK_CASH_DISPENSER` - Check Cash Dispenser
        * `CHECK_RECEIPT_PRINTER` - Check Receipt Printer
        * `CHECK_SOFTWARE_ERROR` - Check Software Error
        * `RECORD_OBSERVATION` - Record Observation
        * `RECORD_ERROR` - Record Error
        * `AUTHORIZED_TROUBLESHOOTING` - Authorized Troubleshooting
        * `PERFORM_AUTHORIZED_ACTION` - Perform Authorized Action
        * `RETEST_ATM` - Retest ATM
        * `VERIFY_SERVICE` - Verify Service
        * `ESCALATE` - Escalate
        * `ESCALATE_INCIDENT` - Escalate Incident
    AtmCurrentlyWorkingEnum:
      enum:
      - 'YES'
      - 'NO'
      - UNKNOWN
      type: string
      description: |-
        * `YES` - Yes
        * `NO` - No
        * `UNKNOWN` - Unknown
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 80
        entity:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 80
        previous_value:
          nullable: true
        new_value:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity
      - entity_id
      - id
      - user_name
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        district_name:
          type: string
          readOnly: true
        atm_count:
          type: string
          readOnly: true
        operational_count:
          type: string
          readOnly: true
        fault_count:
          type: string
          readOnly: true
        critical_count:
          type: string
          readOnly: true
        maintenance_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 30
        branch_type:
          type: string
          maxLength: 60
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        status:
          $ref: '#/components/schemas/BranchStatusEnum'
        opening_date:
          type: string
          format: date
          nullable: true
        district:
          type: integer
          readOnly: true
      required:
      - atm_count
      - code
      - created_at
      - critical_count
      - district
      - district_name
      - fault_count
      - id
      - maintenance_count
      - name
      - operational_count
      - updated_at
    BranchReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        report_id:
          type: string
          readOnly: true
        atm_reference:
          type: string
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        reported_by_name:
          type: string
          readOnly: true
        reviewed_by_name:
          type: string
          readOnly: true
        linked_incident_id:
          type: string
          readOnly: true
        linked_incident_number:
          type: string
          readOnly: true
        active_incident:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        problem_type:
          $ref: '#/components/schemas/ProblemTypeEnum'
        severity:
          $ref: '#/components/schemas/PriorityEnum'
        confirmed_severity:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
          description: |-
            Severity confirmed by district operations (branch cannot force critical).

            * `LOW` - Low
            * `MEDIUM` - Medium
            * `HIGH` - High
            * `CRITICAL` - Critical
        atm_currently_working:
          $ref: '#/components/schemas/AtmCurrentlyWorkingEnum'
        description:
          type: string
        observed_error:
          type: string
        problem_started_at:
          type: string
          format: date-time
          nullable: true
        customer_impact:
          type: string
          maxLength: 255
        evidence:
          type: string
          format: uri
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|pdf|mp4|mov)$
        status:
          allOf:
          - $ref: '#/components/schemas/BranchReportStatusEnum'
          readOnly: true
        dismissal_reason:
          type: string
          readOnly: true
        atm:
          type: integer
        branch:
          type: integer
          readOnly: true
        reported_by:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - active_incident
      - atm
      - atm_reference
      - branch
      - branch_name
      - confirmed_severity
      - created_at
      - description
      - dismissal_reason
      - id
      - linked_incident_id
      - linked_incident_number
      - report_id
      - reported_by
      - reported_by_name
      - reviewed_by
      - reviewed_by_name
      - status
      - updated_at
    BranchReportStatusEnum:
      enum:
      - SUBMITTED
      - RECEIVED
      - REVIEWING
      - CONVERTED_TO_INCIDENT
      - ASSIGNED
      - RESOLVED
      - VERIFIED
      - CLOSED
      - REVIEWED
      - DISMISSED
      type: string
      description: |-
        * `SUBMITTED` - Submitted
        * `RECEIVED` - Received
        * `REVIEWING` - Reviewing
        * `CONVERTED_TO_INCIDENT` - Converted to Incident
        * `ASSIGNED` - Assigned
        * `RESOLVED` - Resolved
