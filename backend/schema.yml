  /api/branch-reports/:
    get:
      operationId: branch_reports_list
      parameters:
      - in: query
        name: atm
        schema:
          type: integer
      - in: query
        name: branch
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: problem_type
        schema:
          type: string
          enum:
          - CARD_READER
          - CASH_DISPENSER
          - DISPLAY
          - GENERAL
          - HARDWARE
          - NETWORK_COMMUNICATION
          - POWER
          - RECEIPT_PRINTER
          - SECURITY
          - SOFTWARE
          - UNKNOWN
        description: |-
          * `NETWORK_COMMUNICATION` - Network / Communication
          * `POWER` - Power
          * `DISPLAY` - Display
          * `CARD_READER` - Card Reader
          * `CASH_DISPENSER` - Cash Dispenser
          * `RECEIPT_PRINTER` - Receipt Printer
          * `SOFTWARE` - Software / Application
          * `HARDWARE` - Hardware
          * `SECURITY` - Security-Related Technical Issue
          * `GENERAL` - General ATM Error
          * `UNKNOWN` - Unknown
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
          * `CRITICAL` - Critical
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ASSIGNED
          - CLOSED
          - CONVERTED_TO_INCIDENT
          - DISMISSED
          - RECEIVED
          - RESOLVED
          - REVIEWED
          - REVIEWING
          - SUBMITTED
          - VERIFIED
        description: |-
          * `SUBMITTED` - Submitted
          * `RECEIVED` - Received
          * `REVIEWING` - Reviewing
          * `CONVERTED_TO_INCIDENT` - Converted to Incident
          * `ASSIGNED` - Assigned
          * `RESOLVED` - Resolved
          * `VERIFIED` - Verified
          * `CLOSED` - Closed
          * `REVIEWED` - Reviewed
          * `DISMISSED` - Dismissed
      tags:
      - branch-reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchReportList'
          description: ''
    post:
      operationId: branch_reports_create
      tags:
      - branch-reports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchReport'
          application/json:
            schema:
