openapi: 3.0.3
info:
  title: CBE Enterprise ATM & ICT Support API
  version: 1.0.0
  description: Scoped internal technical-support API. No customer or banking transaction
    data.
paths:
  /api/atms/:
    get:
      operationId: atms_list
      description: Writes audit log entries for create/update of a model-viewset resource.
      parameters:
      - in: query
        name: assigned_technician
        schema:
          type: integer
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: branch__district
        schema:
          type: integer
      - in: query
        name: health
        schema:
          type: string
          enum:
          - CRITICAL
          - DEGRADED
          - HEALTHY
          - MAINTENANCE
          - OFFLINE
          - UNKNOWN
          - WARNING
        description: |-
          * `HEALTHY` - Healthy
          * `WARNING` - Warning
          * `DEGRADED` - Degraded
          * `CRITICAL` - Critical
          * `OFFLINE` - Offline
          * `MAINTENANCE` - Maintenance
          * `UNKNOWN` - Unknown
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CRITICAL
          - DEGRADED
          - FAULT
          - MAINTENANCE
          - OFFLINE
          - OPERATIONAL
          - UNDER_REPAIR
          - UNKNOWN
          - WARNING
        description: |-
          Technical / operational condition of the ATM.

          * `OPERATIONAL` - Operational
          * `WARNING` - Warning
          * `DEGRADED` - Degraded
          * `FAULT` - Fault
          * `OFFLINE` - Offline
          * `CRITICAL` - Critical
          * `MAINTENANCE` - Maintenance
          * `UNDER_REPAIR` - Under Repair
          * `UNKNOWN` - Unknown
      tags:
      - atms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedATMList'
          description: ''
    post:
      operationId: atms_create
      description: Writes audit log entries for create/update of a model-viewset resource.
      tags:
      - atms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATM'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ATM'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ATM'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATM'
          description: ''
  /api/atms/{id}/:
    get:
      operationId: atms_retrieve
      description: Writes audit log entries for create/update of a model-viewset resource.
      parameters:
      - in: path
        name: id
